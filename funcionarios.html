<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de funcionário – Hotel Aurora</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <header>
    <h1>Hotel Aurora<small>Sistema administrativo</small></h1>
    <nav id="menu" aria-label="Menu principal">
      <a href="../index.html">Início</a>
      <a href="hospedes.html">Hóspedes</a>
      <a href="quartos.html">Quartos</a>
      <a href="reservas.html">Reservas</a>
      <a href="funcionarios.html" aria-current="page">Funcionários</a>
      <a href="consumos.html">Consumos</a>
    </nav>
  </header>

  <main>
    <h2>Cadastro de funcionário</h2>
    <p class="apoio">Registre a equipe do hotel. O salário não pode ficar abaixo do piso do cargo.</p>

    <form id="form-funcionarios" class="tpi2" action="../php/funcionarios.php" method="post">
      <label>Nome completo <input type="text" name="nome" required></label>
      <label>CPF <input type="text" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required></label>
      <label>Cargo
        <select name="cargo" required>
          <option value="">Selecione</option>
          <option value="recepcionista">Recepcionista</option>
          <option value="camareira">Camareira</option>
          <option value="cozinheiro">Cozinheiro</option>
          <option value="manobrista">Manobrista</option>
          <option value="gerente">Gerente</option>
        </select>
      </label>
      <label>Salário (R$) <input type="number" name="salario" min="0" step="0.01" required></label>
      <label>Data de admissão <input type="date" name="admissao" required></label>
      <label>E-mail <input type="email" name="email" required></label>
      <button type="submit">Cadastrar funcionário</button>
    </form>

    <div id="resposta" role="status" aria-live="polite"></div>
    <p><a href="../index.html">Voltar à página inicial</a></p>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
