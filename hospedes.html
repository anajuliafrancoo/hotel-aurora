<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de hóspede – Hotel Aurora</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <header>
    <h1>Hotel Aurora<small>Sistema administrativo</small></h1>
    <nav id="menu" aria-label="Menu principal">
      <a href="../index.html">Início</a>
      <a href="hospedes.html" aria-current="page">Hóspedes</a>
      <a href="quartos.html">Quartos</a>
      <a href="reservas.html">Reservas</a>
      <a href="funcionarios.html">Funcionários</a>
      <a href="consumos.html">Consumos</a>
    </nav>
  </header>

  <main>
    <h2>Cadastro de hóspede</h2>
    <p class="apoio">Registre o titular da reserva. Só maiores de 18 anos podem ser cadastrados.</p>

    <form id="form-hospedes" class="tpi2" action="../php/hospedes.php" method="post">
      <label>Nome completo <input type="text" name="nome" required></label>
      <label>CPF <input type="text" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required></label>
      <label>E-mail <input type="email" name="email" required></label>
      <label>Telefone com DDD <input type="tel" name="telefone" placeholder="(34) 99999-9999" required></label>
      <label>Data de nascimento <input type="date" name="data_nascimento" required></label>
      <button type="submit">Cadastrar hóspede</button>
    </form>

    <div id="resposta" role="status" aria-live="polite"></div>
    <p><a href="../index.html">Voltar à página inicial</a></p>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
