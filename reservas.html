<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova reserva – Hotel Aurora</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <header>
    <h1>Hotel Aurora<small>Sistema administrativo</small></h1>
    <nav id="menu" aria-label="Menu principal">
      <a href="../index.html">Início</a>
      <a href="hospedes.html">Hóspedes</a>
      <a href="quartos.html">Quartos</a>
      <a href="reservas.html" aria-current="page">Reservas</a>
      <a href="funcionarios.html">Funcionários</a>
      <a href="consumos.html">Consumos</a>
    </nav>
  </header>

  <main>
    <h2>Nova reserva</h2>
    <p class="apoio">Informe o hóspede, o período e o tipo de quarto. O total é calculado automaticamente.</p>

    <form id="form-reservas" class="tpi2" action="../php/reservas.php" method="post">
      <label>CPF do hóspede <input type="text" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required></label>
      <label>Tipo de quarto
        <select name="tipo_quarto" required>
          <option value="">Selecione</option>
          <option value="solteiro">Solteiro</option>
          <option value="casal">Casal</option>
          <option value="familia">Família</option>
          <option value="suite">Suíte</option>
        </select>
      </label>
      <label>Check-in <input type="date" name="checkin" required></label>
      <label>Check-out <input type="date" name="checkout" required></label>
      <label>Número de hóspedes <input type="number" name="num_hospedes" min="1" max="6" required></label>
      <label class="larga">Observações <textarea name="observacoes" maxlength="200" placeholder="Ex.: berço extra, chegada após as 22h"></textarea></label>
      <button type="submit">Registrar reserva</button>
    </form>

    <div id="resposta" role="status" aria-live="polite"></div>
    <p><a href="../index.html">Voltar à página inicial</a></p>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
